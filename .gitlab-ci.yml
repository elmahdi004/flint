stages:
  - security-scan

trivy_scan:
  stage: security-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "🔍 Scan Trivy de flint_commerce..."
    - trivy fs --scanners vuln,secret,misconfig --format table --output trivy-report.txt .
    - cat trivy-report.txt
    # exit-code 0 = on ne bloque pas encore le pipeline (gates ajoutés plus tard)
    - trivy fs --scanners vuln,secret,misconfig --exit-code 0 .
  artifacts:
    paths:
      - trivy-report.txt
    when: always
